[workspace]
members = [
    "crates/somma-common",
    "apps/somma-expenses/backend",
    "apps/somma-vehicles/backend",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["nilbyte"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "set-header"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
jsonwebtoken = "9.3"
bcrypt = "0.15"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
csv = "1.3"
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1.10"
base64 = "0.22"
somma-common = { path = "crates/somma-common" }
