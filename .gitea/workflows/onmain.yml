name: On Main
run-name: On Main - ${{ gitea.actor }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

# As imagens usam os nomes que o servidor (repo infrastructure, apps/infra/somma)
# já puxa: expenses-backend (inclui migrate + migrations) e expenses-web.
env:
  REGISTRY: "gitea.nilbyte.com.br"
  IMAGE_NAMESPACE: "nilbyte/somma"
  GIT_USER_NAME: "ci-bot"
  GIT_USER_EMAIL: "ci@nilbyte.com.br"

jobs:
  build-backend:
    runs-on: runner
    steps:
      - name: Checkout main
        run: |
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea.nilbyte.com.br" > ~/.git-credentials
          echo "http://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea:3000" >> ~/.git-credentials
          git clone --branch main "${{ gitea.server_url }}/${{ gitea.repository }}.git" .
          git checkout "${{ gitea.sha }}" || true

      - name: Login to registry
        run: |
          echo "${{ secrets.TOKEN_COMPLETE }}" | docker login "${{ env.REGISTRY }}" -u notNilton --password-stdin

      - name: Build and push backend image
        run: |
          VERSION=$(cat backend/VERSION | tr -d '[:space:]')
          docker build -f backend/Dockerfile \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-backend:latest" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-backend:${VERSION}" \
            .
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-backend:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-backend:${VERSION}"

  build-web:
    runs-on: runner
    steps:
      - name: Checkout main
        run: |
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea.nilbyte.com.br" > ~/.git-credentials
          echo "http://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea:3000" >> ~/.git-credentials
          git clone --branch main "${{ gitea.server_url }}/${{ gitea.repository }}.git" .
          git checkout "${{ gitea.sha }}" || true

      - name: Login to registry
        run: |
          echo "${{ secrets.TOKEN_COMPLETE }}" | docker login "${{ env.REGISTRY }}" -u notNilton --password-stdin

      - name: Build and push web image
        run: |
          VERSION=$(node -e "process.stdout.write(require('./web/package.json').version)")
          docker build -f web/Dockerfile \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-web:latest" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-web:${VERSION}" \
            web/
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-web:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-web:${VERSION}"

  deploy:
    needs: [build-backend, build-web]
    runs-on: runner
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    steps:
      - name: Deploy Somma Stack to Niflheim Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' << 'EOSSH'
            set -e
            INFRA_DIR="/home/notNilton/infrastructure/apps/infra/somma"

            echo "🚀 Atualizando stack Somma no servidor..."
            cd "$INFRA_DIR"

            for compose_file in docker-compose.*.yml; do
              if [ -f "$compose_file" ]; then
                project_name="somma-${compose_file#docker-compose.}"
                project_name="${project_name%.yml}"
                echo "⬇️ Baixando imagens para $compose_file (projeto $project_name)..."
                docker compose -p "$project_name" -f "$compose_file" pull
                echo "🔄 Atualizando containers para $compose_file (projeto $project_name)..."
                docker compose -p "$project_name" -f "$compose_file" up -d --remove-orphans
              fi
            done

            echo "🎉 Deploy do Somma concluído com sucesso!"
          EOSSH
