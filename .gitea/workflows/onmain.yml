        id: check
        run: |
          CHANGED=false
          if [ "${{ gitea.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=true
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -Eq '^(apps/doc/|.gitea/workflows/)'; then
              CHANGED=true
            fi
          else
            CHANGED=true
          fi
          echo "CHANGED=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          echo "${{ secrets.TOKEN_COMPLETE }}" | docker login "${{ env.REGISTRY }}" -u notNilton --password-stdin

      - name: Build and push doc image
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          VERSION=$(cat apps/doc/VERSION | tr -d '[:space:]')
          docker build -f apps/doc/Dockerfile \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/doc:latest" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/doc:${VERSION}" \
            apps/doc/
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/doc:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/doc:${VERSION}"

  deploy:
    needs: [build-expenses-backend, build-expenses-web, build-vehicles-backend, build-vehicles-web, build-doc]
    runs-on: runner
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    steps:
      - name: Deploy Somma Stack to Niflheim Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' << 'EOSSH'
            set -e
            INFRA_DIR="/home/notNilton/infrastructure/apps/infra/somma"

            echo "🚀 Atualizando stack Somma no servidor..."
            cd "$INFRA_DIR"

            for compose_file in docker-compose.*.yml; do
              if [ -f "$compose_file" ]; then
                echo "⬇️ Baixando imagens para $compose_file..."
                docker compose -f "$compose_file" pull || true
                echo "🔄 Atualizando containers para $compose_file..."
                docker compose -f "$compose_file" up -d --remove-orphans || true
              fi
            done

            echo "🎉 Deploy do Somma concluído com sucesso!"
          EOSSH
