name: On Main
run-name: On Main - ${{ gitea.actor }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: "gitea.nilbyte.com.br"
  IMAGE_NAMESPACE: "nilbyte/somma"
  GIT_USER_NAME: "ci-bot"
  GIT_USER_EMAIL: "ci@nilbyte.com.br"

jobs:
  build-expenses-backend:
    runs-on: runner
    steps:
      - name: Checkout main
        run: |
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea.nilbyte.com.br" > ~/.git-credentials
          echo "http://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea:3000" >> ~/.git-credentials
          git clone --branch main "${{ gitea.server_url }}/${{ gitea.repository }}.git" .
          git checkout "${{ gitea.sha }}" || true

      - name: Detect changes
        id: check
        run: |
          CHANGED=false
          if [ "${{ gitea.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=true
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -Eq '^(apps/somma-expenses/backend/|database/|.gitea/workflows/|go\.(work|sum))'; then
              CHANGED=true
            fi
          else
            CHANGED=true
          fi
          echo "CHANGED=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          echo "${{ secrets.TOKEN_COMPLETE }}" | docker login "${{ env.REGISTRY }}" -u notNilton --password-stdin

      - name: Build and push expenses backend image
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          VERSION=$(cat apps/somma-expenses/backend/VERSION | tr -d '[:space:]')
          docker build -f apps/somma-expenses/backend/Dockerfile \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-backend:latest" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-backend:${VERSION}" \
            .
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-backend:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-backend:${VERSION}"

  build-expenses-web:
    runs-on: runner
    steps:
      - name: Checkout main
        run: |
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea.nilbyte.com.br" > ~/.git-credentials
          echo "http://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea:3000" >> ~/.git-credentials
          git clone --branch main "${{ gitea.server_url }}/${{ gitea.repository }}.git" .
          git checkout "${{ gitea.sha }}" || true

      - name: Detect changes
        id: check
        run: |
          CHANGED=false
          if [ "${{ gitea.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=true
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -Eq '^(apps/somma-expenses/web/|.gitea/workflows/)'; then
              CHANGED=true
            fi
          else
            CHANGED=true
          fi
          echo "CHANGED=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          echo "${{ secrets.TOKEN_COMPLETE }}" | docker login "${{ env.REGISTRY }}" -u notNilton --password-stdin

      - name: Build and push expenses web image
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          VERSION=$(node -e "process.stdout.write(require('./apps/somma-expenses/web/package.json').version)")
          docker build -f apps/somma-expenses/web/Dockerfile \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-web:latest" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-web:${VERSION}" \
            apps/somma-expenses/web/
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-web:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/expenses-web:${VERSION}"

