name: On Main
run-name: On Main - ${{ gitea.actor }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: "gitea.nilbyte.com.br"
  IMAGE_NAMESPACE: "nilbyte/somma"
  GIT_USER_NAME: "ci-bot"
  GIT_USER_EMAIL: "ci@nilbyte.com.br"

jobs:
  build-backend:
    runs-on: runner
    steps:
      - name: Checkout main
        run: |
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea.nilbyte.com.br" > ~/.git-credentials
          echo "http://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea:3000" >> ~/.git-credentials
          git clone --branch main "${{ gitea.server_url }}/${{ gitea.repository }}.git" .
          git checkout "${{ gitea.sha }}" || true

      - name: Detect changes
        id: check
        run: |
          CHANGED=false
          if [ "${{ gitea.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=true
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -Eq '^(backend/|database/|.gitea/workflows/|go\.(work|sum))'; then
              CHANGED=true
            fi
          else
            CHANGED=true
          fi
          echo "CHANGED=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          echo "${{ secrets.TOKEN_COMPLETE }}" | docker login "${{ env.REGISTRY }}" -u notNilton --password-stdin

      - name: Build and push backend image
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          VERSION=$(cat backend/VERSION | tr -d '[:space:]')
          docker build -f backend/Dockerfile \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:latest" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:${VERSION}" \
            .
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:${VERSION}"

  build-web:
    runs-on: runner
    steps:
      - name: Checkout main
        run: |
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea.nilbyte.com.br" > ~/.git-credentials
          echo "http://oauth2:${{ secrets.TOKEN_COMPLETE }}@gitea:3000" >> ~/.git-credentials
          git clone --branch main "${{ gitea.server_url }}/${{ gitea.repository }}.git" .
          git checkout "${{ gitea.sha }}" || true

      - name: Detect changes
        id: check
        run: |
          CHANGED=false
          if [ "${{ gitea.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=true
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -Eq '^(web/|.gitea/workflows/)'; then
              CHANGED=true
            fi
          else
            CHANGED=true
          fi
          echo "CHANGED=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          echo "${{ secrets.TOKEN_COMPLETE }}" | docker login "${{ env.REGISTRY }}" -u notNilton --password-stdin

      - name: Build and push web image
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          VERSION=$(node -e "process.stdout.write(require('./web/package.json').version)")
          docker build -f web/Dockerfile \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/web:latest" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/web:${VERSION}" \
            web/
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/web:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/web:${VERSION}"

  deploy:
    needs: [build-backend, build-web]
    runs-on: runner
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    steps:
      - name: Deploy Somma Stack to Niflheim Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' << 'EOSSH'
            set -e
            INFRA_DIR="/home/notNilton/infrastructure/apps/infra/somma"

            echo "🚀 Atualizando stack Somma no servidor..."
            cd "$INFRA_DIR"

            for compose_file in docker-compose.*.yml; do
              if [ -f "$compose_file" ]; then
                echo "⬇️ Baixando imagens para $compose_file..."
                docker compose -f "$compose_file" pull || true
                echo "🔄 Atualizando containers para $compose_file..."
                docker compose -f "$compose_file" up -d --remove-orphans || true
              fi
            done

            echo "🎉 Deploy do Somma concluído com sucesso!"
          EOSSH
