services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: somma-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-somma}
    ports:
      - "${POSTGRES_PORT:-5454}:5432"
    volumes:
      - somma-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d somma"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: somma-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/somma?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: somma-backend
    restart: always
    ports:
      - "3300:3300"
    environment:
      ENV: ${ENV:-development}
      PORT: 3300
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/somma?sslmode=disable}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:3400}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-x}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: web
      dockerfile: Dockerfile
    container_name: somma-web
    restart: always
    ports:
      - "3400:3400"
    environment:
      PORT: 3400
      API_URL: ${API_URL:-http://localhost:3300}
    depends_on:
      - backend

volumes:
  somma-postgres-data:
